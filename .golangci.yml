run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - gocritic
    - unconvert
    - depguard
    - errorlint
    # wrapcheck deliberately not enabled yet: this codebase's error-wrap
    # convention (%w on every propagated external error) is a documented
    # target (see CONTRIBUTING.md), not yet a fact on the ground across
    # every package. Turning this linter on before doing that normalization
    # pass would just fail CI on ~30 pre-existing, unreviewed call sites.
    # Tracked as a real follow-up, not silently done as part of a CI fix.

linters-settings:
  depguard:
    rules:
      # internal/model and internal/config are dependency-free leaves: every
      # other package in the engine depends on the shapes they define, so
      # they must never depend back on anything else under internal/.
      model-and-config-are-leaves:
        list-mode: strict
        files:
          - "**/internal/model/**"
          - "**/internal/config/**"
        allow:
          - $gostd
          - gopkg.in/yaml.v3
        deny:
          - pkg: github.com/BarterX-Tech/dossierx/internal
            desc: "internal/model and internal/config are dependency-free leaves and must not import any other internal/... package"

      # internal/lint must never import internal/lock: the correct edge
      # runs the other way (lock imports lint, gating a lock operation on a
      # clean lint run). It also must not import render, reaudit, or
      # buildorder, none of which lint has any business depending on.
      #
      # ONE FILE IS EXEMPTED BY NAME, and by name is the whole point: a pattern
      # like "!**_test.go" would exempt every test in the package, and a real
      # violation would then land in a _test.go and never be seen. What the rule
      # protects is the SHIPPED dependency graph — what the binary links — and
      # citation_grammar_test.go links neither package into anything a client
      # runs. It exists because the "[n]" citation marker is recognized by two
      # independent scanners, internal/lint's (which decides what the lints
      # report) and internal/render/markdown's (which decides what the reader
      # sees), and nothing but agreement between them makes either meaningful.
      # A test proving they agree has to be able to see both. Moving it out of
      # this package is not the cheaper answer either: it reads citedSourceRefs,
      # which is unexported, so the move would mean widening lint's API to
      # satisfy a lint rule about lint's API.
      lint-must-not-import-lock-and-friends:
        list-mode: lax
        files:
          - "**/internal/lint/**"
          - "!**/internal/lint/citation_grammar_test.go"
        deny:
          - pkg: github.com/BarterX-Tech/dossierx/internal/lock
            desc: "internal/lint must never import internal/lock — lock imports lint, not the other way around"
          - pkg: github.com/BarterX-Tech/dossierx/internal/render
            desc: "internal/lint must never import internal/render — render is top-of-stack"
          - pkg: github.com/BarterX-Tech/dossierx/internal/reaudit
            desc: "internal/lint must never import internal/reaudit"
          - pkg: github.com/BarterX-Tech/dossierx/internal/buildorder
            desc: "internal/lint must never import internal/buildorder"

      # render is a top-of-stack sink: it may import other internal/...
      # packages, but nothing under internal/{lint,catalog,lock,loader,
      # implink,buildorder} may import render in return.
      # internal/buildorder joined the list when it grew the mermaid generator
      # the viewer's Build order tab renders from: render imports buildorder,
      # so the reverse edge is a cycle, and the one thing buildorder wants from
      # render — components.ClaimLabel — is transcribed into
      # internal/buildorder/mermaid.go instead, exactly as internal/graph
      # transcribes it and for the same reason.
      # citation_grammar_test.go is exempted here for the reason given at
      # lint-must-not-import-lock-and-friends above: it is the cross-check that
      # the lint's citation scanner and the renderer's agree, so it has to see
      # both, and it links neither into anything shipped. Both rules deny the
      # same import, so exempting one and not the other exempts nothing.
      render-is-top-of-stack:
        list-mode: lax
        files:
          - "**/internal/lint/**"
          - "!**/internal/lint/citation_grammar_test.go"
          - "**/internal/catalog/**"
          - "**/internal/lock/**"
          - "**/internal/loader/**"
          - "**/internal/implink/**"
          - "**/internal/buildorder/**"
        deny:
          - pkg: github.com/BarterX-Tech/dossierx/internal/render
            desc: "internal/render is top-of-stack; nothing under internal/{lint,catalog,lock,loader,implink,buildorder} may import it"

      # internal/graph builds the claims-graph payload the viewer's graph
      # pane reads, and the whole point of that package is stated as an
      # import direction: THE GRAPH AUDITS CLAIMS, NOT CODE.
      #
      # Each of the three denials below closes a specific, tempting mistake
      # rather than being defensive in general:
      #
      #   - implink answers "is this claim grounded in real code?". That is
      #     "dossierx check"'s impl-link verdict, with its own vocabulary and
      #     its own exit code, and a second surface for it would be a second
      #     place to keep correct. An import here would mean somebody was
      #     re-adding the has_code_link field this design removed outright.
      #   - lint computes verdicts. graph emits facts and lets the browser
      #     compute verdicts against the reader's current scope; a gap list
      #     precomputed in Go is wrong the moment a reader scopes to one
      #     module. It is also the wrong direction: check runs lint BEFORE
      #     catalog, so lint's answers do not exist to be borrowed here.
      #   - render is top-of-stack and imports graph. The reverse edge is an
      #     import cycle waiting to be written by whoever wants
      #     components.ClaimLabel (see internal/graph/build.go's claimLabel,
      #     which is duplicated for exactly this reason and says so).
      #
      # The prefix match is load-bearing on the last one: it also denies
      # internal/render/components, which transitively imports both lint and
      # implink and would smuggle them in through the side door.
      graph-audits-claims-not-code:
        list-mode: lax
        files:
          - "**/internal/graph/**"
        deny:
          - pkg: github.com/BarterX-Tech/dossierx/internal/implink
            desc: "internal/graph audits claims, not code — whether a claim is grounded in real code is dossierx check's impl-link verdict and stays there"
          - pkg: github.com/BarterX-Tech/dossierx/internal/lint
            desc: "internal/graph emits facts; verdicts are computed in the browser against the reader's current scope"
          - pkg: github.com/BarterX-Tech/dossierx/internal/render
            desc: "internal/render is top-of-stack and imports internal/graph; the reverse edge is a cycle"

  errcheck:
    check-type-assertions: true
    check-blank: true

  revive:
    confidence: 0.8

  gocritic:
    enabled-tags:
      - diagnostic
      - style
    # "performance" (hugeParam/rangeValCopy) deliberately not enabled yet:
    # it would flag model.Claim-by-value across dozens of call sites, which
    # is a real signature-changing refactor (value vs. pointer semantics)
    # the maintainers should decide on purpose, not something a lint gate
    # should silently force. Tracked as a follow-up, not a CI blocker.

  wrapcheck:
    ignoreSigs:
      - .Errorf(
      - errors.New(
      - errors.Unwrap(
      - errors.Join(

issues:
  exclude-dirs:
    - testdata
