section: What a widget is
body: |
  A widget is the smallest unit this corpus documents. Its identifier is an
  inline `code` span, which is the `code` element the `code-inline-bg` token
  paints.

  ```go
  // a fenced block, which is the .claim-body pre the code-bg token paints
  func Widget() string { return "widget" }
  ```

  | field | meaning |
  | --- | --- |
  | id | the widget's identity |
  | state | draft or locked |

  The table above is the `.md-table` whose `th` the `table-head-bg` token
  paints. The footnote marker below it is a source reference [1], which is the
  `.claim-source` row the `:target` rule paints when a reader deep-links to it.
