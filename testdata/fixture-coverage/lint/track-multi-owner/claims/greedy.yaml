id: trackmod.contract.greedy
facet: contract
module: trackmod
status: draft
layout: card
body: |
  One claim declaring itself the owner of two tracks. Both memberships are
  individually well formed and both name declared tracks, so nothing else has
  anything to say about them -- and both tracks do have an owner, so neither
  track-empty nor track-unowned fires. What is wrong is only that the same
  sentence is being asked to be the acceptance statement for two features at
  once, which means neither feature has one.
tracks:
  - id: checkout
    role: owns
  - id: refunds
    role: owns
rests_on:
  - trackmod.contract.helper
governed_by:
  type: none
  reason: fixture claim, not backed by any real doctrine
