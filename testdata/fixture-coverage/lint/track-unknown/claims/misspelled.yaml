id: trackmod.contract.misspelled
facet: contract
module: trackmod
status: draft
layout: card
body: |
  A claim citing a track the project never declared. The membership itself is
  well formed -- a non-empty id, no role, named once -- so the only thing wrong
  with it is the name, which is precisely the typo the config registry exists to
  catch: without track-unknown this hyphenated spelling would silently become a
  second feature holding one claim.
rests_on:
  - trackmod.contract.anchor
tracks:
  - id: check-out
governed_by:
  type: none
  reason: fixture claim, not backed by any real doctrine
