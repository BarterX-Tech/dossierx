# gate-cost-model.yaml fixture — a surface funded from a document basis nothing defines
#
# repo.everything is not in gateLedgerBases, so nothing knows which bytes it
# resolves to. A name nobody defined must not read as a decision somebody made.
schema: dossierx.gate-cost-model/1
reserve:
  value: 20000
  unit: output_tokens
backstop_factor:
  value: 1.5
classes:
  - name: falsification-dense
    seed:
      value: 1.2
      numerator_unit: output_tokens
      denominator_unit: bytes
      derived_from: "A fixture value. It is not a measurement of this project and must never be copied into the committed model."
  - name: newest-entry-only
    seed:
      value: 0.6
      numerator_unit: output_tokens
      denominator_unit: bytes
      derived_from: "A fixture value. It is not a measurement of this project and must never be copied into the committed model."
surfaces:
  - name: readme
    class: falsification-dense
    document_basis: manifest.tracked_files
  - name: changelog
    class: newest-entry-only
    document_basis: repo.everything
  - name: roadmap
    class: newest-entry-only
    document_basis: manifest.tracked_files
