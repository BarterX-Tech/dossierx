# gate-cost-model.yaml fixture — a legal model that leaves one surface's document basis undecided
#
# Legal, and unable to quote roadmap. This is the state the committed model is
# in for site and binary-and-viewer: surfaces.yaml's own text says the tracked
# files are not what those agents read, and no other basis is extractable yet.
schema: dossierx.gate-cost-model/1
reserve:
  value: 20000
  unit: output_tokens
backstop_factor:
  value: 1.5
classes:
  - name: falsification-dense
    seed:
      value: 1.2
      numerator_unit: output_tokens
      denominator_unit: bytes
      derived_from: "A fixture value. It is not a measurement of this project and must never be copied into the committed model."
  - name: newest-entry-only
    seed:
      value: 0.6
      numerator_unit: output_tokens
      denominator_unit: bytes
      derived_from: "A fixture value. It is not a measurement of this project and must never be copied into the committed model."
surfaces:
  - name: readme
    class: falsification-dense
    document_basis: manifest.tracked_files
  - name: changelog
    class: newest-entry-only
    document_basis: manifest.tracked_files
  - name: roadmap
    class: newest-entry-only
    document_basis: undecided
