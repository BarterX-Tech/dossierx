# gate-cost-model.yaml fixture — the same move, with the reason the bounds require
#
# A bound is not a prohibition. The 2.9x unit correction is exactly the move a
# human must be able to make in one edit — but it arrives with the sentence a
# reviewer reads to find out why.
schema: dossierx.gate-cost-model/1
reserve:
  value: 20000
  unit: output_tokens
backstop_factor:
  value: 1.5
classes:
  - name: falsification-dense
    seed:
      value: 1.2
      numerator_unit: output_tokens
      denominator_unit: bytes
      derived_from: "A fixture value."
    k:
      - value: 3.5
        numerator_unit: output_tokens
        denominator_unit: bytes
        previous: 1.2
        rationale: "The first wave came in far over its quote."
        bound_override: "Phase 0 quoted in output tokens and measured in input context, 2.9x apart. This is the correction, not a trend."
  - name: newest-entry-only
    seed:
      value: 0.6
      numerator_unit: output_tokens
      denominator_unit: bytes
      derived_from: "A fixture value."
surfaces:
  - name: readme
    class: falsification-dense
    document_basis: manifest.tracked_files
  - name: changelog
    class: newest-entry-only
    document_basis: manifest.tracked_files
  - name: roadmap
    class: newest-entry-only
    document_basis: manifest.tracked_files
