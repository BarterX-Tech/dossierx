# gate-cost-model.yaml fixture — a legal model whose seeds nobody has supplied
#
# This is the committed model's shape: every unit rule satisfied, every surface
# accounted for, and nothing fundable, because no output-per-byte seed exists.
schema: dossierx.gate-cost-model/1
reserve:
  value: 20000
  unit: output_tokens
backstop_factor:
  value: 1.5
classes:
  - name: falsification-dense
    seed:
      undecided: true
      reason: "No output-token-per-byte seed has been supplied. The plan's 3.5 is total tokens per document token."
  - name: newest-entry-only
    seed:
      undecided: true
      reason: "No output-token-per-byte seed has been supplied. The plan's 2.0 is total tokens per document token."
surfaces:
  - name: readme
    class: falsification-dense
    document_basis: manifest.tracked_files
  - name: changelog
    class: newest-entry-only
    document_basis: manifest.tracked_files
  - name: roadmap
    class: newest-entry-only
    document_basis: manifest.tracked_files
