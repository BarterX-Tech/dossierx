# gate/method.yaml — HOW a surface is judged, declared once and read by both
# sides.
#
# WHY THIS FILE EXISTS. The gate's central defence is that an input outside the
# assembled bundle cannot exist: if an agent can reach a byte the assembler did
# not hand it, no key over that bundle is total, and every carry-forward decision
# built on it degrades into a hope about what the model chose to read. That
# defence is a claim about the TOOL GRANT, and until this file existed the only
# gateMethod value in the repository was a test fixture granting Bash, Grep and
# Read — the three tools the design specifically forbids, in the shape an
# implementer would copy.
#
# THE GRANT IS AN EXACT SET, NOT A DENY LIST. A screen that rejects
# Read/Grep/Glob/Bash by name lets Task, WebFetch, or an MCP tool called
# mcp__filesystem__read_file walk straight past it and stays green while doing
# so. What is written below is everything the agent may call; anything not named
# is not granted. cmd/dossierx/gate_stage2_test.go pins this list against a
# literal, so widening it costs a deliberate edit that a human reviews rather
# than a line in a config nobody diffs.
#
# WHAT THIS FILE CANNOT PROMISE. The entity that actually grants or withholds
# tools is the agent harness, which lives outside this repository and outside
# every test here. What is checkable from inside this tree is that
# scripts/gate-stage2/run.sh REQUESTS exactly this set and requests it as an
# exclusive allow-list — and that is what is checked. Whether the runtime
# honoured the request is not observable here, and this file states that rather
# than implying otherwise. It is the same boundary tests/ci_workflow_test.go
# states about the workflow file it reads.
#
# THE MODEL IS KEYED BY ID STRING. method_version hashes what is written here, so
# moving to another model moves every key and re-runs every surface, which is
# correct: the same prompt on a different model is a different question. What it
# does NOT catch is provider-side drift under a stable alias — the id stays
# "claude-opus-5" while what answers to it changes. Nothing in this repository
# can see that, and nothing here pretends to.

model: claude-opus-5

# The exact tool grant. Both are report-only: they carry the agent's answer back
# and can read nothing.
#
#   SurfaceFinding — report one mismatch (surface, rule, consequence,
#                    failure_scenario, blocking, detail, and optionally about)
#   SurfaceVerdict — report the surface's verdict, exactly once
#
# There is deliberately no file, shell, search, network or subagent tool here.
# The bundle is the whole evidence set, and that is the property every key in the
# system rests on.
tools:
  - SurfaceFinding
  - SurfaceVerdict
