# surfaces.yaml — every client-facing surface this project has, and beside it
# every path that is DECLARED out of scope, with the reason.
#
# WHY THIS FILE EXISTS. The release gate reads prose against code, one agent per
# surface. That is only as complete as the surface list, and until this file
# existed the list lived in a scope document — so a new client-facing file
# appeared with nothing to notice it, and the only way to find the gap was an
# audit. tests/surfaces_manifest_test.go asserts that EVERY TRACKED FILE is
# claimed by exactly one entry below, which turns "a surface nobody declared"
# from a silent hole into a red build.
#
# THE RULE IS "EXACTLY ONE", NOT "AT LEAST ONE". An out-of-scope entry cannot
# quietly swallow a file that a surface also claims: the test names both entries
# and fails. That is the same principle the gate itself runs on — never narrow
# coverage silently — applied to the list of things being covered.
#
# READS: WHAT A SURFACE BORROWS BUT DOES NOT OWN. A surface entry may carry a
# `reads:` list of exact repository-relative paths whose bytes its reviewing
# agent needs in order to judge its OWN documents. It is not a second claim on
# those files: ownership is decided by `paths:` alone, the exactly-one rule is
# about `paths:` alone, and a file's reviewing agent is still the one surface
# that claims it. A file that is only ever borrowed and never owned is still
# unclaimed, and still a red build.
#
# WHY IT EXISTS. Because every file belongs to exactly one surface and the gate
# hands each agent that one surface's documents, a sentence whose truth turns on
# ANOTHER surface's file was unanswerable by construction — the file was not
# handed, not withheld, and not present. The frame tells an agent that a byte it
# does not hold is never a reason to guess and never a reason to pass: report
# FAILED and name the byte you needed. So gate rounds produced that same class
# of finding over and over — 20 of the abandoned v0.5.2 release's 39 first-round
# findings were agents naming a byte the gate's own assembly had withheld from
# them, each finding correct, each about the gate's material rather than the
# release. `reads:` closes each such gap permanently: declare the path, and that
# pair cannot recur.
#
# THE RULES, enforced twice — by gateSurfaceReferences in
# cmd/dossierx/gate_fingerprint_test.go as a refusal on the run path (an
# unresolvable entry refuses the WHOLE fan-out, never one bundle), and by
# tests/surfaces_manifest_test.go where a person editing this file meets them
# first:
#   - exact paths only, never patterns. A surface borrowing another's material
#     names what it borrowed; a glob would let the borrowed set grow as the
#     other surface does, without anyone deciding, and would make the key
#     depend on directory contents.
#   - the path must be a tracked file. One that has moved refuses the whole
#     fan-out, because the alternative — dropping it — leaves the agent
#     reporting the coverage gap this list exists to close.
#   - it may not be a file this surface's own `paths:` already claim. That is
#     either a stale entry or a pattern that has grown, and those are
#     different edits.
#   - only surfaces borrow. An out_of_scope entry has no reviewing agent, so a
#     reads: list on one hands material to nobody.
#   - an out_of_scope path is a legal BORROW, and often the point: Makefile and
#     .github/ are deliberately not reviewed AS PROSE, which is a statement
#     about who reports on them, not about who may read them.
#
# The borrowed bytes are handed to the surface's agent in its bundle, marked
# "NOT yours to report on", and reach the surface's key through the bundle
# digest — so editing a referenced file re-runs the surfaces that declared it
# and no others. What a reads: entry CANNOT promise is its own continued
# relevance: a borrow whose citing sentence was deleted resolves cleanly and
# merely pads the bundle. That is why every entry below carries the sentence it
# exists for — prune the entry when the sentence goes.
#
# PATTERN GRAMMAR (see matchSurfacePattern in the test):
#   - a pattern ending in "/" claims every file beneath that directory
#   - "**/" matches any number of leading directory segments
#   - "*" matches any run of characters within a single segment
#   - anything else is an exact repository-relative path
#   - an entry's "not:" patterns carve exceptions out of its own "paths"
#
# Adding a file that matches nothing here is a build failure. That is the point:
# the next missing surface should cost a compile, not an audit.

surfaces:
  - name: readme
    what: The project's front door on GitHub — install, the two roles, the noun
      table, the exit-code table, the lock lifecycle.
    reach: Every visitor. Carries two of the four release-version pins.
    paths:
      - README.md
    reads:
      # "The CI template runs plain `dossierx check`, one step, and pins no
      # `fetch-depth`" is a claim about that file's contents, made where the
      # README tells a reader to copy it into their own .github/workflows/.
      - scripts/ci/dossierx-check.yml
      # Five behavioural claims about the installer — asks before writing,
      # resolves core.hooksPath, handles linked worktrees, never replaces a
      # foreign hook without --force, re-running is a no-op — plus the `--yes`
      # flag the paste-to-your-agent block instructs an agent to type.
      - scripts/install-git-hook.sh
      # "(with install-git-hook.ps1 for PowerShell users)" attributes the same
      # five behaviours to the pair, and a divergence between the two forms is
      # exactly what would make that sentence false.
      - scripts/install-git-hook.ps1
      # Deep anchors described by what the reader will find at them: the
      # flag-store integrity paragraph says FORMAT.md "states the same thing"
      # at a named section, and the designed-boundary paragraph says FORMAT.md
      # "states it in full".
      - FORMAT.md
      # "see ... the CHANGELOG's full migration table".
      - CHANGELOG.md
      # "See CONTRIBUTING.md for the development workflow, package boundary
      # rules, and how to run tests and lint locally."
      - CONTRIBUTING.md

  - name: changelog
    what: The release's own account of itself, and the only place a
      silent-behaviour change can be announced to somebody deciding whether to
      upgrade.
    reach: Consumers deciding whether to upgrade.
    paths:
      - CHANGELOG.md
    reads:
      # Entries assert what this file decides: the archive names "derived from
      # .goreleaser.yaml at the released commit", changelog.filters.exclude
      # gaining "^Merge ", and the claim that this config "is its only
      # reviewable surface".
      - .goreleaser.yaml
      # The v0.5.1 entry names this file as one of four whose printed text
      # changed, and describes what its stubs now say.
      - cmd/dossierx/retired.go
      # "The hook's two are shell, in scripts/install-git-hook.sh", the install
      # line said to fetch from the v0.5.0 raw, and the --uninstall path said to
      # exist "in this repository and in no release".
      - scripts/install-git-hook.sh
      # The headline SILENT item is that the embedded skills changed and every
      # consumer must re-export; a fingerprint says they moved, only the bundle
      # itself says what moved. Older entries describe sections this file gained.
      - skills/dossierx/SKILL.md
      # Entries assert what that document now contains and what stands behind
      # it ("docs/RELEASING.md now has a check behind it", "is the single
      # description of how this project releases", "names three sample
      # viewers", "gains a matching pre-merge item").
      - docs/RELEASING.md
      # The entry contrasting what the workflow "used to be" with what a tag
      # now triggers is a claim about this file's current triggers and jobs.
      - .github/workflows/release.yml
      # Entries send the reader to FORMAT.md sections by name (the markdown
      # ceiling, the detection-boundary section) and summarise them.
      - FORMAT.md

  - name: claim-format-spec
    what: The claim format — the schema, the id grammar, the layouts, and what
      the claim-body renderer accepts.
    reach: Anyone authoring claims. surface.json's markdown_constructs is the
      corpus this document is a claim about.
    paths:
      - FORMAT.md
    reads:
      # THE SCHEMA AND THE ID GRAMMAR ARE THIS DOCUMENT'S SUBJECT, and its
      # prompt asks whether "the id grammar stated matches the grammar the
      # engine enforces" and whether "every schema field named here exists".
      # surface.json carries lint-rule NAMES and a flat error-code list — no
      # grammar, no field list — so without the engine's own side of each claim
      # those questions are unanswerable by construction.
      - internal/lint/id_shape.go
      - internal/model/claim.go
      - internal/config/config.go
      # Cited by exact path as where the locked-claim hash deny-list lives.
      - internal/lock/lockedhash.go
      # Linked by path as the two tests that pin the staged-audit boundary; a
      # test folded into another file leaves the citation dangling.
      - internal/lock/audit_boundary_test.go
      - internal/check/staged_no_parent_test.go
      # Named as the one workflow-shaped consumer of the boundary argument.
      - scripts/ci/dossierx-check.yml
      # The `comments:` block documents author, replies, resolved_by/at and
      # reopened_by/at; model.Comment is where those fields live or do not.
      - internal/model/comment.go

  - name: roadmap
    what: The deferred and unverified register. Falsification here is inverted —
      the question is whether this release SHIPPED something the entry still
      calls deferred.
    reach: Sets expectations for anyone deciding to depend on this.
    paths:
      - ROADMAP.md
    reads:
      # The register's closing entry rests on "FORMAT.md documents the shipped
      # behaviour as the rule". Judging that sentence without the file is
      # judging a claim about a document against nothing.
      - FORMAT.md

  - name: contributing
    what: How to build and test, including the two suites `go test ./...` does
      not reach.
    reach: Contributors.
    paths:
      - CONTRIBUTING.md
    reads:
      # "Adding a file is two steps: `surfaces.yaml` has to claim it" describes
      # this file's own rules — exactly-one, the pattern grammar, what an
      # out_of_scope entry means. Judging any of that without the manifest is
      # judging a summary against nothing.
      - surfaces.yaml
      # Named as what "requires every tracked file to be claimed by exactly
      # one of the two", exactly-one and not at-least-one.
      - tests/surfaces_manifest_test.go
      # The suite table names `make viewer-test` and `make hook-test` and says
      # what each reaches; the nested-module claim is that a new module needs a
      # CI job AND a Makefile target.
      - Makefile
      # "`make hook-test` # scripts/hook-smoke-test.sh" attributes the suite to
      # this script and describes it as shell driving a real binary against a
      # real git repository.
      - scripts/hook-smoke-test.sh
      # Which suites CI runs, on which platforms ("Linux, macOS and Windows"),
      # and the pinned golangci-lint version a contributor is told to install
      # locally to match.
      - .github/workflows/ci.yml
      # "Package boundaries" names the depguard rule `render-is-top-of-stack`
      # and states its deny list as an EXACT set of five packages. A widened
      # deny set leaves a contributor believing the build enforces a boundary
      # it does not.
      - .golangci.yml
      # The stated build floor, "Go 1.26 or newer", and the claim that "the
      # engine's go.mod stays cobra + yaml.v3". Nothing in surface.json or the
      # delta carries a Go directive or a dependency list.
      - go.mod
      # "The viewer suite still falls back to the usual install locations and
      # only skips when nothing is found; the site extraction requires the
      # variable and fails without it" — resolveBrowser in this file is the
      # authority on which halves of that sentence are true.
      - viewer-tests/harness_test.go
      # The first command a contributor types under "Running the CLI locally".
      # A renamed fixture makes it fail on a clean tree.
      - testdata/fixture-basic/project.config.yaml
      # "fails the build if a nested module is ever added without a CI job AND
      # a Makefile target" — whether that is a conjunction is a claim about
      # this test and settleable only from it.
      - tests/nested_module_coverage_test.go
      # "Patterns to follow" names this file and the symbol attachEdgesOverride
      # inside it. Nothing in surface.json is a file or symbol inventory, so a
      # renamed helper would leave a contributor chasing something gone.
      - internal/render/depended_by_view.go
      # "`.goreleaser.yaml`'s changelog grouping ... depend on this" is a claim
      # about that file's changelog.groups regexps, made in the Conventional
      # Commits section.
      - .goreleaser.yaml
      # "Cutting a release" makes checkable statements about that document and
      # its driver, including the COUNT and identity of the post-publish checks
      # it says stay a person's.
      - docs/RELEASING.md

  - name: release-procedure
    what: The one description of how this project releases, including its own
      pin-site list — prose that has gone stale twice and checks itself.
    reach: The maintainer, next release.
    paths:
      - docs/RELEASING.md
    reads:
      # The procedure states what the publish build stamps and under which
      # ldflags template, what GoReleaser's own check refuses, and which
      # archives the name_template and format_overrides produce.
      - .goreleaser.yaml
      # It describes the forge's gate on a tag — what is checked, in which
      # order, and what a refusal means.
      - .github/workflows/release.yml
      # Most command lines in this document are NOT `dossierx` invocations, so
      # surface.json cannot answer for them: the make targets
      # (release-publish, ci-evidence, viewer-test) and their required
      # variables live in the Makefile, and the three gate-stage2 subcommands
      # (delta, record, fanout) and their flags live in the shell script.
      # Without both, the item asking whether every command still takes the
      # flags shown could be answered for a minority of the commands and no
      # more.
      - Makefile
      - scripts/gate-stage2/run.sh
      # The procedure asserts these three are TRACKED, GENERATED artifacts and
      # names the commands that regenerate each.
      - testdata/fixture-basic/viewer/index.html
      - testdata/fixture-portability/viewer/index.html
      - testdata/fixture-graph-demo/viewer/index.html
      # The document hard-codes the surface count ("thirteen agents read the
      # thirteen surfaces") throughout, and the manifest is the only thing that
      # can settle it.
      - surfaces.yaml
      # It prints the -answer-record invocation an operator types once per
      # agent; nothing else says whether those flags exist.
      - cmd/dossierx/gate_answer_test.go
      # The document describes the driver at every reach — "a nine-step driver
      # whose preconditions include the gate below", D1's nine questions and
      # its worktree refusal with the printed `switch --detach` recovery, D2's
      # `--no-ff` merge carried by value into D4's tag, D7's archive check
      # between the two pushes, the D9 handoff that checks nothing — and the
      # driver IS TestReleaseDriverPublishes in this file. Its own reviewing
      # agent had to report that none of those claims could be verified
      # because the one authority for them was never handed over.
      - cmd/dossierx/gate_driver_test.go
      # "the driver's D1 asks the forge for an active tag ruleset covering
      # `refs/tags/v*` that restricts creation and update, and refuses the
      # release ... when the rule is absent" — and the whole of **The forge
      # restricts who can create release tags**: active-not-evaluate, tag
      # target, creation AND update required, deletion deliberately not,
      # covering include and no covering exclude, the fnmatch refusal, the
      # token-scope refusals, and what the check cannot promise. This file is
      # where every one of those lives or does not; a maintainer trusting the
      # sentence without it might configure no ruleset, expecting
      # `make release-publish` to stop them.
      - cmd/dossierx/gate_tagrules_test.go
      # The G1 capture invocations the procedure spells out, flag by flag: the
      # cross-release render diff, the skills export capture, the release-notes
      # prediction, and the rendered-site extraction. The fourth was missing
      # and the count above it said three, so the release-procedure agent was
      # asked to check the site-text invocation and its three stated
      # behaviours — that DOSSIERX_SITE_TEXT_OUT and _TREE imply each other,
      # that the tree must be a full 40-digit object name, that the stamp is
      # the document's first field — with no file that names any of them. It
      # reported the missing byte rather than guessing, which is the answer
      # the frame asks for; this is the entry that answer names.
      - tests/render_diff_capture_test.go
      - tests/skills_export_capture_test.go
      - tests/release_notes_predict_test.go
      - viewer-tests/site_dom_test.go
      # The procedure states the whole tool grant — SurfaceFinding and
      # SurfaceVerdict, nothing else, passed as an exclusive allow-list — and
      # this file is where that is declared.
      - gate/method.yaml

  - name: agent-skills
    what: The SKILL.md bundles, plus the embed directive and reading order that
      decide which of them ship and in what sequence a client's agent meets
      them.
    reach: Unfixable after the tag. These are go:embed-ed into the binary and
      installed into OTHER people's repositories by `dossierx skills export`,
      where a stale rule teaches an agent the wrong recovery against a corpus
      nobody here will ever see. Carries one release-version pin.
    paths:
      - skills/
    reads:
      # The bundles defer to FORMAT.md by name — the markdown ceiling, and the
      # principle that an in-repo ledger cannot attest anything against the
      # person who can write it — and summarise both. A summary drifts from
      # what it summarises.
      - FORMAT.md
      # THE RECOVERY TABLES ARE THE POINT OF THIS SURFACE, and the delta
      # reports only that a package's behaviour fingerprint MOVED, never what
      # changed inside it. The project's own account of what changed is the
      # only thing that can close the gap between "the hash moved" and "the
      # recovery is still right".
      - CHANGELOG.md
      # The router's bootstrap tells a client to add the merge-gate workflow
      # and calls CI the authority; dossierx-code-links argues from what that
      # template actually runs ("a hook and a CI run stay green while ...").
      # If the template's invocation ever changed, both bundles would advise
      # from a premise that moved.
      - scripts/ci/dossierx-check.yml
      # The router's bootstrap step tells the agent to fetch this script at the
      # pinned tag, read it to the client, and run it with `--yes` — claims
      # about the script's flags and its printed account of itself.
      - scripts/install-git-hook.sh
      # The router's write_conflict row states the acquire timeout (~10s), that
      # no timeout clears a stale sentinel, and that the failure message names
      # the lock file. This file is where all three live or do not.
      - internal/lock/filelock.go

  - name: exported-skills
    what: The skills export output, checked in as symlinks so this repository's
      own agents read exactly the bytes a client's agents would.
    reach: Every agent operating in this repository; a divergence here means the
      export is producing something other than the source.
    paths:
      - .claude/skills/
    # The linked bundles carry the same sentences agent-skills reviews from
    # skills/, so some of the same borrowed context recurs here. That is
    # duplication by design, the same way the bytes themselves are reviewed
    # twice under two different questions.
    reads:
      # The exported router's bootstrap instructs fetching and running this
      # script with --yes; two bundles assert the hook it installs runs
      # `dossierx check --staged`.
      - scripts/install-git-hook.sh
      # The exported code-links bundle argues from what the shipped merge-gate
      # template runs: plain `check`, which scans source. If that ever became
      # --validate the bundle would advise the opposite of the truth.
      - scripts/ci/dossierx-check.yml
      # Two exported bundles send the reader to FORMAT.md for the markdown
      # ceiling and the in-repo-ledger principle, and summarise both.
      - FORMAT.md

  - name: site
    what: The marketing and documentation site, sources and entry points. The
      surface is the RENDERED DOM of a real build (plus its head metadata), not
      the component source — but every file here decides what that DOM says.
    reach: Every prospective user. The only client-facing statement of what this
      project is, and the one whose counts have gone stale live.
    paths:
      - site/
    reads:
      # The site's release ledger (`releases` in site/src/content.ts, rendered
      # onto the releases page) must agree with the CHANGELOG's newest heading
      # — the release driver refuses to publish when they disagree — and the
      # ledger's per-release summaries are compressions of that file's entries.
      # Without it the site agent is judging one half of the one agreement the
      # release rests on.
      - CHANGELOG.md

  - name: ci-merge-gate-template
    what: The merge-gate workflow clients copy into their own repository.
    reach: Ships a stale binary into somebody else's CI. Carries one
      release-version pin, and it is the pin that matters most.
    paths:
      - scripts/ci/dossierx-check.yml
    reads:
      # The workflow header names the ledger findings a client's tree will
      # produce — lock-content-drift, the lock-ledger-* family, the
      # comment-digest ones, the build-order ones — and cites a FORMAT.md
      # section by its exact title as carrying the full argument. Ledger
      # findings are neither lint rules nor error codes, so surface.json can
      # neither confirm nor refute the list.
      - FORMAT.md
      # "The boundary is pinned in Go, in ..." — both named by exact path.
      - internal/check/staged_no_parent_test.go
      - internal/lock/audit_boundary_test.go

  - name: install-scripts
    what: The pre-commit hook installers, curl'd at the pinned tag by README and
      by the router skill — which also tells the agent to SHOW the client the
      contents before running it.
    reach: Ships a false engine statement into somebody else's repository, and
      is read aloud on the way in.
    paths:
      - scripts/install-git-hook.sh
      - scripts/install-git-hook.ps1
    reads:
      # The shell header asserts "Both paths are exercised by
      # scripts/hook-smoke-test.sh, which CI runs on windows-latest" — a claim
      # about that script AND about a job existing in that workflow. The router
      # skill has these scripts read ALOUD to a client before running, so a
      # stale sentence here is a false statement spoken into somebody else's
      # repository.
      - scripts/hook-smoke-test.sh
      - .github/workflows/ci.yml
      # The header names a FORMAT.md section by its exact wording and calls it
      # the canonical statement of the staged-audit boundary.
      - FORMAT.md
      # The hook body justifies its `-c core.quotepath=false` override by
      # saying the engine's git runner prepends the same override for the same
      # reason.
      - internal/check/staged.go
      # Both the hook body's "See scripts/ci/dossierx-check.yml's header for
      # the argument" and the post-install output pointing a consumer at that
      # template rest on the template saying what these scripts say it says. A
      # hook that announces "CI is the authority" while nobody checks what it
      # points a client at is the vacuous half of a two-part promise.
      - scripts/ci/dossierx-check.yml

  - name: release-notes
    what: The GitHub release body, generated at tag time by GoReleaser from
      Conventional Commit SUBJECTS. .goreleaser.yaml's changelog.groups and
      changelog.filters.exclude are the rules that decide what it says, so the
      config file IS the reviewable surface — the notes themselves do not exist
      until the tag.
    reach: Published client-facing prose that nothing audited before. A
      user-visible change landing under a `docs:` or `chore:` subject is dropped
      by the filters and is invisible on the release page while being fully
      described in CHANGELOG.md.
    paths:
      - .goreleaser.yaml
    reads:
      # This surface's first question is "does every user-visible change in the
      # release appear somewhere in the predicted body", and its prompt names
      # CHANGELOG.md as where a dropped change is "fully described". That check
      # needs the authoritative list of this release's user-visible changes,
      # and the CHANGELOG is that list; without it the comparison can only be
      # made against the delta's fingerprints, which say THAT something moved
      # and never WHAT.
      - CHANGELOG.md

  - name: binary-and-viewer
    what: The engine itself, and every string compiled into it — cobra Short and
      Long text and flag usage (`dossierx <noun> --help`), the error messages and
      hints, and the viewer templates, CSS and graph client rendered into every
      client's index.html.
    reach: Unfixable after the tag. This is the code surface.json's command,
      flag, error-code, lint-rule, route, render and behaviour fields are all
      extracted FROM, and prose is judged against.
    paths:
      - cmd/dossierx/
      - internal/
    not:
      - "**/*_test.go"
      - internal/render/markdown/generate-goldens/
    reads:
      # cmd/dossierx/retired.go and main.go both assert their hints are THE
      # SAME WORDS as skills/dossierx/SKILL.md's "if you remember an older
      # command" table. Half of that claim is in files this surface is handed;
      # the other half is the router bundle, which agent-skills owns.
      - skills/dossierx/SKILL.md

out_of_scope:
  - name: tests-and-fixtures
    reason: Tests, fixture corpora and the golden-file generator are how the
      surfaces above are held true; they are not themselves observable by a
      client of the binary. The committed sample viewers under testdata/ are
      generated artifacts and are pinned by
      tests/fixture_staleness_test.go, not by a prose review.
    paths:
      - "**/*_test.go"
      - tests/
      - viewer-tests/
      - testdata/
      - internal/render/markdown/generate-goldens/

  - name: release-gate-artifacts
    reason: An inventory OF the surfaces rather than one of them. surface.json is
      derived from the tree by cmd/dossierx/surface_test.go and regenerated
      rather than written; this manifest is the list being checked. Reviewing
      either as prose would be reviewing the gate's own working notes.
    paths:
      - surface.json
      - surfaces.yaml
      # Declared before the lanes that create them, which is legal: this manifest
      # constrains files to have an entry, not entries to have files (verified
      # against TestEveryTrackedFileIsDeclaredASurfaceOrExcluded and
      # TestSurfaceManifestEntriesAreWellFormed). Every lane adding a file would
      # otherwise need this one file, and a convention saying "one lane owns it"
      # did not survive five concurrent agents once already.
      - surface.baseline.json
      - gate/
      - gate-cost-model.yaml
      - gate-cost-ledger.json
      - scripts/gate-stage2/
      # The stage-2 agent harness — the runner that enforces the tool grant on
      # the reading agents. Gate machinery like scripts/gate-stage2/, not a
      # surface a client of the binary can observe.
      - scripts/gate-agent/
      # No testdata/ entries here: out_of_scope tests-and-fixtures already claims
      # testdata/ wholesale, and the manifest rule is EXACTLY one entry per file.
      # Declaring the gate's fixture directories again double-claimed them.

  - name: community-and-legal
    reason: Makes no claim about how the engine behaves, so no release can
      falsify it. SECURITY.md is deliberately written without a version number;
      LICENSE is legal text.
    paths:
      - CODE_OF_CONDUCT.md
      - SECURITY.md
      - SUPPORT.md
      - MAINTAINERS.md
      - LICENSE

  - name: design-records
    reason: Dated design records — plans, specs and decision notes tied to the
      release that produced them. They are historical by construction, so
      "did this release make it false" does not apply; rewriting them would
      destroy the record.
    paths:
      - docs/decisions/
      - docs/superpowers/

  - name: repository-automation
    reason: Build, CI and release machinery for THIS repository. Nothing here is
      read by a client of the binary — the one workflow that is copied outward,
      scripts/ci/dossierx-check.yml, is a surface above, and .goreleaser.yaml is
      a surface above because its changelog rules decide what the published
      release notes say. The install-hook smoke test, the Pester suite that
      exercises the PowerShell wrapper, and the comment end-to-end script all
      drive the shipped scripts; they are not themselves shipped.
    paths:
      - .github/
      - .claude/workflows/
      - Makefile
      - scripts/e2e-comments.sh
      - scripts/hook-smoke-test.sh
      - scripts/install-git-hook.Tests.ps1
      - scripts/normalize-claims/

  - name: toolchain-config
    reason: Linter, editor, VCS and module configuration. It constrains how this
      repository is built and formatted and states nothing about the engine's
      behaviour.
    paths:
      - .editorconfig
      - .gitattributes
      - .gitignore
      - .golangci.yml
      - go.mod
      - go.sum

  - name: in-repo-agent-instructions
    reason: Instructions to agents working IN this repository, not a statement
      about the shipped engine. CLAUDE.md governs how a change is made here; it
      is not something a client can observe.
    paths:
      - CLAUDE.md
