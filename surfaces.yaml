# surfaces.yaml — every client-facing surface this project has, and beside it
# every path that is DECLARED out of scope, with the reason.
#
# WHY THIS FILE EXISTS. The release gate reads prose against code, one agent per
# surface. That is only as complete as the surface list, and until this file
# existed the list lived in a scope document — so a new client-facing file
# appeared with nothing to notice it, and the only way to find the gap was an
# audit. tests/surfaces_manifest_test.go asserts that EVERY TRACKED FILE is
# claimed by exactly one entry below, which turns "a surface nobody declared"
# from a silent hole into a red build.
#
# THE RULE IS "EXACTLY ONE", NOT "AT LEAST ONE". An out-of-scope entry cannot
# quietly swallow a file that a surface also claims: the test names both entries
# and fails. That is the same principle the gate itself runs on — never narrow
# coverage silently — applied to the list of things being covered.
#
# READS: WHAT A SURFACE BORROWS BUT DOES NOT OWN. A surface entry may carry a
# `reads:` list of exact repository-relative paths whose bytes its reviewing
# agent needs in order to judge its OWN documents. It is not a second claim on
# those files: ownership is decided by `paths:` alone, the exactly-one rule is
# about `paths:` alone, and a file's reviewing agent is still the one surface
# that claims it.
#
# WHY IT EXISTS. Because every file belongs to exactly one surface, and the gate
# hands each agent that one surface's documents, a sentence whose truth turns on
# ANOTHER surface's file was unanswerable by construction — the file was not
# handed, not withheld, and not present. The frame tells an agent that a byte it
# does not hold is never a reason to guess and never a reason to pass: report
# FAILED and name the byte you needed. So every gate round produced the same
# class of finding, correct each time, about the gate's own material rather than
# about the release. `reads:` closes each one permanently: declare the path, and
# that pair cannot recur.
#
# THE RULES, all enforced by gateSurfaceReferences in
# cmd/dossierx/gate_fingerprint_test.go, each as a refusal rather than a
# silently shorter bundle:
#   - exact paths only, never patterns. A surface borrowing another's material
#     names what it borrowed; a glob would let the borrowed set grow as the
#     other surface does, without anyone deciding.
#   - the path must be a tracked file. One that has moved refuses the whole
#     fan-out, because the alternative is an agent reporting the coverage gap
#     this list exists to close.
#   - it may not be a file this surface's own `paths:` already claim. That is
#     either a stale entry or a pattern that has grown, and those are different
#     edits.
#   - an out_of_scope path is legal, and often the point: `.github/` and
#     `Makefile` are deliberately not reviewed AS PROSE, which is a statement
#     about who reports on them, not about who may read them.
#
# The borrowed bytes reach the surface's key through the bundle, so editing a
# referenced file re-runs the surfaces that declared it and no others.
#
# PATTERN GRAMMAR (see matchSurfacePattern in the test):
#   - a pattern ending in "/" claims every file beneath that directory
#   - "**/" matches any number of leading directory segments
#   - "*" matches any run of characters within a single segment
#   - anything else is an exact repository-relative path
#   - an entry's "not:" patterns carve exceptions out of its own "paths"
#
# Adding a file that matches nothing here is a build failure. That is the point:
# the next missing surface should cost a compile, not an audit.

surfaces:
  - name: readme
    what: The project's front door on GitHub — install, the two roles, the noun
      table, the exit-code table, the lock lifecycle.
    reach: Every visitor. Carries two of the four release-version pins.
    paths:
      - README.md
    reads:
      # "runs plain `dossierx check`, one step, and pins no `fetch-depth`" is a
      # claim about that file's contents, made where the README tells a reader
      # to copy it into their own .github/workflows/.
      - scripts/ci/dossierx-check.yml
      # Five behavioural claims about the installer — asks first, resolves
      # core.hooksPath, handles linked worktrees, refuses a foreign hook without
      # --force, re-running is a no-op — plus the `--yes` flag the paste-to-your-
      # agent block instructs an agent to type.
      - scripts/install-git-hook.sh
      - scripts/install-git-hook.ps1
      # Two deep anchors, each described by what the reader will find at it.
      - FORMAT.md
      # "the CHANGELOG's full migration table", and CONTRIBUTING covering the
      # workflow, the boundary rules and how to run tests and lint.
      - CHANGELOG.md
      - CONTRIBUTING.md

  - name: changelog
    what: The release's own account of itself, and the only place a
      silent-behaviour change can be announced to somebody deciding whether to
      upgrade.
    reach: Consumers deciding whether to upgrade.
    paths:
      - CHANGELOG.md
    reads:
      # v0.5.2's headline VISIBLE change is a claim about the ldflags stamp —
      # `{{.Version}}` strips the leading v, `{{.Tag}}` keeps it. The file that
      # decides it is the only thing that can confirm or refute the entry, and
      # surface.json has no field for the binary's version string at all, so
      # without this the one thing consumers are told to check before upgrading
      # is unanswerable.
      - .goreleaser.yaml
      # An entry that says a verb's stub was added, or deferred, is a claim about
      # this file — and `retired` is one of the arrays the delta reports moving,
      # so the changelog has to be able to say which direction it moved.
      - cmd/dossierx/retired.go
      # The same entry cites the roadmap as the record of what was deferred.
      - ROADMAP.md

  - name: claim-format-spec
    what: The claim format — the schema, the id grammar, the layouts, and what
      the claim-body renderer accepts.
    reach: Anyone authoring claims. surface.json's markdown_constructs is the
      corpus this document is a claim about.
    paths:
      - FORMAT.md
    reads:
      # THE TWO SCHEMAS AND THE ID GRAMMAR ARE THIS DOCUMENT'S SUBJECT, and until
      # v0.5.2 no reviewing agent could check any of them: surface.json carries
      # the lint rule NAME `id-shape` and a flat list of error codes, but no
      # grammar, no rule-to-code mapping and no field list. The site repeats the
      # same prose, and prose agreeing with prose is what this gate exists to
      # distrust. These are the engine's own side of each claim.
      - internal/lint/id_shape.go
      - internal/model/claim.go
      - internal/config/config.go
      # Cited by exact path as where the locked-claim hash deny-list lives.
      - internal/lock/lockedhash.go
      # Linked as the two tests that "pin rather than assume" the staged-audit
      # boundary. A test folded into another file leaves the citation dangling.
      - internal/lock/audit_boundary_test.go
      - internal/check/staged_no_parent_test.go
      # "is one `dossierx check` step and pins no `fetch-depth`" — a claim about
      # a file this release moved, since its version pin changed.
      - scripts/ci/dossierx-check.yml
      # The `comments:` block documents replies, resolved_by/at and
      # reopened_by/at. model.Comment is where those fields live or do not.
      - internal/model/comment.go

  - name: roadmap
    what: The deferred and unverified register. Falsification here is inverted —
      the question is whether this release SHIPPED something the entry still
      calls deferred.
    reach: Sets expectations for anyone deciding to depend on this.
    paths:
      - ROADMAP.md

  - name: contributing
    what: How to build and test, including the two suites `go test ./...` does
      not reach.
    reach: Contributors.
    paths:
      - CONTRIBUTING.md
    reads:
      # "Adding a file is two steps: `surfaces.yaml` has to claim it" describes
      # this file's own rules — exactly-one, the pattern grammar, what an
      # out_of_scope entry means. Judging any of that without the manifest is
      # judging a summary against nothing.
      - surfaces.yaml
      # The suite table names `make hook-test` and `make viewer-test` and says
      # what each reaches; the nested-module claim is that a new module needs a
      # CI job AND a Makefile target.
      - Makefile
      # "`.goreleaser.yaml`'s changelog grouping ... depend[s] on this" is a
      # claim about that file's `changelog.groups` regexps, made in the
      # Conventional Commits section.
      - .goreleaser.yaml
      # "Cutting a release" makes three checkable statements about that document
      # and its driver, including the COUNT and identity of the post-publish
      # checks it says stay a person's.
      - docs/RELEASING.md
      # Which suites CI runs, on which platforms, in a job named "git hook", and
      # with which pinned golangci-lint version a contributor is told to install
      # locally. Every one of those reads the same if a job was renamed.
      - .github/workflows/ci.yml
      # "Package boundaries" names the depguard rule `render-is-top-of-stack` and
      # states its deny list as an EXACT set. A widened deny set would leave a
      # contributor believing the build enforces a boundary it does not.
      - .golangci.yml
      # The stated build floor, "Go 1.26 or newer". Nothing in surface.json or
      # the delta carries a Go directive, so a toolchain bump would otherwise be
      # invisible to every check the gate has.
      - go.mod
      # The prerequisite table says the viewer suite "only skips when nothing is
      # found" while the Makefile comment said it skips on an unset variable.
      # resolveBrowser is the authority that settles which sentence is right.
      - viewer-tests/harness_test.go
      # The first command a contributor types, under "Running the CLI locally".
      # A renamed fixture makes it fail on a clean tree.
      - testdata/fixture-basic/project.config.yaml
      # "fails the build if a nested module is ever added without a CI job AND a
      # Makefile target" — whether that is a conjunction or a disjunction is a
      # claim about this test and settleable only from it.
      - tests/nested_module_coverage_test.go
      # "Patterns to follow" names this file and the symbol attachEdgesOverride
      # inside it. Nothing in surface.json is a file or symbol inventory, so a
      # renamed helper would leave a contributor chasing something gone.
      - internal/render/depended_by_view.go

  - name: release-procedure
    what: The one description of how this project releases, including its own
      pin-site list — prose that has gone stale twice and checks itself.
    reach: The maintainer, next release.
    paths:
      - docs/RELEASING.md
    reads:
      # The procedure states what the publish build stamps and under which
      # template, and its archive step names the artifacts this file's
      # name_template and format_overrides produce.
      - .goreleaser.yaml
      # It describes the forge's gate on a tag — what is checked, in which
      # order, and what a refusal means — and since v0.5.2 also why the
      # reachability check is gone and must not come back.
      - .github/workflows/release.yml
      # Most command lines in this document are NOT `dossierx` invocations, so
      # surface.json cannot answer for them: the three make targets and their
      # required variables live here, and the three gate-stage2 subcommands and
      # their flags live in the shell script. Without both, the item asking
      # whether every command still takes the flags shown could be answered for
      # a minority of the commands and no more.
      - Makefile
      - scripts/gate-stage2/run.sh
      # The procedure asserts these three are tracked GENERATED artifacts whose
      # first line carries a do-not-edit banner, and counts the generation
      # timestamps inside them.
      - testdata/fixture-basic/viewer/index.html
      - testdata/fixture-portability/viewer/index.html
      - testdata/fixture-graph-demo/viewer/index.html

  - name: agent-skills
    what: The SKILL.md bundles, plus the embed directive and reading order that
      decide which of them ship and in what sequence a client's agent meets
      them.
    reach: Unfixable after the tag. These are go:embed-ed into the binary and
      installed into OTHER people's repositories by `dossierx skills export`,
      where a stale rule teaches an agent the wrong recovery against a corpus
      nobody here will ever see. Carries one release-version pin.
    paths:
      - skills/
    reads:
      # Two bundles defer to FORMAT.md by name — the markdown ceiling, and the
      # principle that an in-repo ledger cannot attest anything against the
      # person who can write it. Whether those attributions are still true is
      # unanswerable without the file.
      - FORMAT.md
      # THE RECOVERY TABLES ARE THE POINT OF THIS SURFACE, and the delta reports
      # only that a package's behaviour fingerprint MOVED, never what changed
      # inside it. Seven moved this release, including internal/lock and
      # internal/comments — exactly the packages behind the recoveries these
      # bundles teach. The project's own account of what changed is the only
      # thing that can close the gap between "the hash moved" and "the recovery
      # is still right".
      - CHANGELOG.md
      # dossierx-code-links tells an agent that a hook AND a CI run stay green
      # over an unlocked claim mid-relock. The hook runs `check --staged`; what
      # CI runs is decided by this template, and the two answers differ.
      - scripts/ci/dossierx-check.yml

  - name: exported-skills
    what: The skills export output, checked in as symlinks so this repository's
      own agents read exactly the bytes a client's agents would.
    reach: Every agent operating in this repository; a divergence here means the
      export is producing something other than the source.
    paths:
      - .claude/skills/

  - name: site
    what: The marketing and documentation site, sources and entry points. The
      surface is the RENDERED DOM of a real build (plus its head metadata), not
      the component source — but every file here decides what that DOM says.
    reach: Every prospective user. The only client-facing statement of what this
      project is, and the one whose counts have gone stale live.
    paths:
      - site/

  - name: ci-merge-gate-template
    what: The merge-gate workflow clients copy into their own repository.
    reach: Ships a stale binary into somebody else's CI. Carries one
      release-version pin, and it is the pin that matters most.
    paths:
      - scripts/ci/dossierx-check.yml
    reads:
      # The workflow header names THIRTEEN ledger findings a client's tree will
      # produce — lock-content-drift, the lock-ledger-* family, the comment-digest
      # ones, the build-order ones. None of that vocabulary is in surface.json:
      # ledger findings are neither lint rules nor error codes, so the inventory
      # can neither confirm nor refute the list. The header also quotes a section
      # title of this file verbatim.
      - FORMAT.md
      # "The boundary is pinned in Go, in ..." — named by exact path, and one of
      # the two is in a package whose fingerprint moved this release.
      - internal/check/staged_no_parent_test.go
      - internal/lock/audit_boundary_test.go

  - name: install-scripts
    what: The pre-commit hook installers, curl'd at the pinned tag by README and
      by the router skill — which also tells the agent to SHOW the client the
      contents before running it.
    reach: Ships a false engine statement into somebody else's repository, and
      is read aloud on the way in.
    paths:
      - scripts/install-git-hook.sh
      - scripts/install-git-hook.ps1
    reads:
      # Both script headers assert "Both paths are exercised by
      # scripts/hook-smoke-test.sh, which CI runs on windows-latest" — a claim
      # about that script AND about a job existing in that workflow. The router
      # skill tells an agent to read these scripts ALOUD to a client before
      # running them, so a stale sentence here is a false statement about the
      # engine spoken into somebody else's repository.
      - scripts/hook-smoke-test.sh
      - .github/workflows/ci.yml
      # The header names a FORMAT.md section by its exact wording and calls it
      # the canonical statement of the staged-audit boundary.
      - FORMAT.md
      # The hook body justifies its `-c core.quotepath=false` override by saying
      # the engine's git runner prepends the same override for the same reason.
      - internal/check/staged.go

  - name: release-notes
    what: The GitHub release body, generated at tag time by GoReleaser from
      Conventional Commit SUBJECTS. .goreleaser.yaml's changelog.groups and
      changelog.filters.exclude are the rules that decide what it says, so the
      config file IS the reviewable surface — the notes themselves do not exist
      until the tag.
    reach: Published client-facing prose that nothing audited before. A
      user-visible change landing under a `docs:` or `chore:` subject is dropped
      by the filters and is invisible on the release page while being fully
      described in CHANGELOG.md.
    paths:
      - .goreleaser.yaml
    reads:
      # This surface's first question is "does every user-visible change in the
      # release appear somewhere in the predicted body". That needs the
      # authoritative list of this release's user-visible changes, and
      # .goreleaser.yaml's own footer names the document that carries it. Without
      # it the check can only be made against the site's rendering of the same
      # facts, which is another document rather than the source.
      - CHANGELOG.md

  - name: binary-and-viewer
    what: The engine itself, and every string compiled into it — cobra Short and
      Long text and flag usage (`dossierx <noun> --help`), the error messages and
      hints, and the viewer templates, CSS and graph client rendered into every
      client's index.html.
    reach: Unfixable after the tag. This is the code surface.json's command,
      flag, error-code, lint-rule, route, render and behaviour fields are all
      extracted FROM, and prose is judged against.
    paths:
      - cmd/dossierx/
      - internal/
    not:
      - "**/*_test.go"
      - internal/render/markdown/generate-goldens/

out_of_scope:
  - name: tests-and-fixtures
    reason: Tests, fixture corpora and the golden-file generator are how the
      surfaces above are held true; they are not themselves observable by a
      client of the binary. The committed sample viewers under testdata/ are
      generated artifacts and are pinned by
      tests/fixture_staleness_test.go, not by a prose review.
    paths:
      - "**/*_test.go"
      - tests/
      - viewer-tests/
      - testdata/
      - internal/render/markdown/generate-goldens/

  - name: release-gate-artifacts
    reason: An inventory OF the surfaces rather than one of them. surface.json is
      derived from the tree by cmd/dossierx/surface_test.go and regenerated
      rather than written; this manifest is the list being checked. Reviewing
      either as prose would be reviewing the gate's own working notes.
    paths:
      - surface.json
      - surfaces.yaml
      # Declared before the lanes that create them, which is legal: this manifest
      # constrains files to have an entry, not entries to have files (verified
      # against TestEveryTrackedFileIsDeclaredASurfaceOrExcluded and
      # TestSurfaceManifestEntriesAreWellFormed). Every lane adding a file would
      # otherwise need this one file, and a convention saying "one lane owns it"
      # did not survive five concurrent agents once already.
      - surface.baseline.json
      - gate/
      - gate-cost-model.yaml
      - gate-cost-ledger.json
      - scripts/gate-stage2/
      # No testdata/ entries here: out_of_scope tests-and-fixtures already claims
      # testdata/ wholesale, and the manifest rule is EXACTLY one entry per file.
      # Declaring the gate's fixture directories again double-claimed them.

  - name: community-and-legal
    reason: Makes no claim about how the engine behaves, so no release can
      falsify it. SECURITY.md is deliberately written without a version number;
      LICENSE is legal text.
    paths:
      - CODE_OF_CONDUCT.md
      - SECURITY.md
      - SUPPORT.md
      - MAINTAINERS.md
      - LICENSE

  - name: design-records
    reason: Dated design records — plans, specs and decision notes tied to the
      release that produced them. They are historical by construction, so
      "did this release make it false" does not apply; rewriting them would
      destroy the record.
    paths:
      - docs/decisions/
      - docs/superpowers/

  - name: repository-automation
    reason: Build, CI and release machinery for THIS repository. Nothing here is
      read by a client of the binary — the one workflow that is copied outward,
      scripts/ci/dossierx-check.yml, is a surface above, and .goreleaser.yaml is
      a surface above because its changelog rules decide what the published
      release notes say. The install-hook smoke test and the comment end-to-end
      script drive the shipped scripts; they are not themselves shipped.
    paths:
      - .github/
      - .claude/workflows/
      - Makefile
      - scripts/e2e-comments.sh
      - scripts/hook-smoke-test.sh
      - scripts/normalize-claims/

  - name: toolchain-config
    reason: Linter, editor, VCS and module configuration. It constrains how this
      repository is built and formatted and states nothing about the engine's
      behaviour.
    paths:
      - .editorconfig
      - .gitattributes
      - .gitignore
      - .golangci.yml
      - go.mod
      - go.sum

  - name: in-repo-agent-instructions
    reason: Instructions to agents working IN this repository, not a statement
      about the shipped engine. CLAUDE.md governs how a change is made here; it
      is not something a client can observe.
    paths:
      - CLAUDE.md
