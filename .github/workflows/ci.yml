name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26.x', 'stable']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race ./...

  # The pre-commit gate is a shell script running a real binary against a real
  # git repository, so no Go test can cover it: the assertions that matter are
  # "git refused the commit", "the hook landed where git actually looks", and
  # "the working tree is byte-identical afterwards". scripts/hook-smoke-test.sh
  # makes those, and this job runs it on all three platforms — the hook body is
  # POSIX sh executed by git's own bundled sh, and Windows is exactly where that
  # claim needs proving rather than asserting.
  hooks:
    name: git hook (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true

      - name: Pre-commit hook smoke test
        # On windows-latest this is Git Bash, the same sh that git itself uses
        # to run hooks there.
        shell: bash
        run: bash scripts/hook-smoke-test.sh

  # viewer-tests/ is a SEPARATE Go module (its own go.mod, requiring chromedp) so
  # that chromedp and its transitive dependencies can never enter the engine's
  # go.mod, which stays cobra + yaml.v3. The price of that isolation is that the
  # root "go test ./..." above cannot see this module at all — for a while
  # nothing else could either, and the browser suite was executed by no job and
  # no Makefile target on any machine but a maintainer's. Every Go test stayed
  # green while the viewer's inline JavaScript — the comment panel wiring, the
  # empty comment chip's click handler, the edge labels — was covered by
  # markup assertions only. This job is what makes the green mean something.
  #
  # The browser is the runner image's preinstalled Google Chrome; no third-party
  # action is used to fetch one. It is resolved EXPLICITLY into
  # DOSSIERX_TEST_BROWSER rather than left to the suite's own probe, because that
  # probe t.Skip()s when it finds nothing — a runner image that quietly dropped
  # Chrome would turn this job green while running zero assertions, which is the
  # exact failure this job exists to end. Set explicitly, the harness t.Fatal()s
  # on a path that is not there.
  viewer:
    name: viewer (headless chrome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
          # Two modules, two go.sum files; the default only sees the root one.
          cache-dependency-path: |
            go.sum
            viewer-tests/go.sum

      - name: Locate a headless-capable Chrome
        run: |
          for c in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$c" ]; then
              echo "using $c"
              echo "DOSSIERX_TEST_BROWSER=$c" >>"$GITHUB_ENV"
              exit 0
            fi
          done
          echo "no Chrome/Chromium found on this runner image; the viewer suite" >&2
          echo "would silently SKIP rather than run, so this job fails instead." >&2
          exit 1

      - name: Viewer browser suite
        working-directory: viewer-tests
        # No -race: this suite is I/O bound on a browser and a subprocess, and
        # the code under test is JavaScript in a page, not Go.
        run: go test -count=1 ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          # Force building golangci-lint from source with the runner's own
          # (1.26.x) Go toolchain, instead of downloading a pre-built
          # release binary — those are compiled by upstream at release
          # time with whatever Go was current then (e.g. v1.64.8's binary
          # release was built with go1.24, older than this module's go.mod
          # floor), which golangci-lint refuses to run under. go install
          # sidesteps that entirely.
          install-mode: goinstall

      # viewer-tests/ is a separate module, and `golangci-lint run ./...` no
      # more descends into it than `go test ./...` does. Without this step its
      # Go code is read by no linter on any machine. Kept as a second step in
      # the same job rather than a second job: it needs the identical toolchain
      # and install-mode reasoning above, and duplicating a job to duplicate
      # that comment is how the two drift apart.
      # tests/nested_module_coverage_test.go fails the build if this step is
      # removed, or if a future nested module lands without one.
      - name: golangci-lint (viewer-tests)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall
          working-directory: viewer-tests

  tidy:
    name: tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true

      - name: go mod tidy (no diff)
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: gofmt (no diff)
        run: |
          fmt_files="$(gofmt -l .)"
          if [ -n "$fmt_files" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_files"
            exit 1
          fi
