# Release — what a `v*` tag publishes.
#
# WHAT THIS FILE DOES, IN FULL. A `v*` tag runs GoReleaser and GoReleaser
# publishes: six archives, `checksums.txt`, and a GitHub release whose notes come
# from the Conventional Commit subjects since the previous tag. There is no
# condition of any kind in front of it. Any commit, on any branch, tagged
# anything beginning with `v`, by anyone who can push a tag, publishes a release
# of this project, and nothing downstream rechecks it, because publishing is
# where this ends.
#
# THAT IS DELIBERATE AND IT IS STATED HERE RATHER THAN IMPLIED. A `gate` job used
# to stand in front of this one, refusing a tag whose commit was not a merge or
# whose tree did not stamp the version being tagged. It was removed with the rest
# of the release gate: this project is alpha, releases are cut by a maintainer
# who reads the tree first, and docs/RELEASING.md is where that reading lives.
#
# SO THESE ARE THE MISTAKES NOTHING CATCHES ANY MORE, and they are the reason
# docs/RELEASING.md asks for each one by hand:
#
#   - tagging the release branch instead of the merge. The branch head already
#     carries this release's stamp, so it looks right from every angle except the
#     one that matters — the tag names a commit that was never merged.
#   - tagging a tree whose site announces a different release. site/releases.html's
#     `data-current="true"` entry is what a visitor is shown; a tag that disagrees
#     with it ships a binary the project's own page calls another version.
#   - tagging the wrong commit outright.
#
# DO NOT ADD A REACHABILITY CHECK HERE WITHOUT MOVING THE DOCUMENTED PUSH ORDER
# FIRST. `merge-base --is-ancestor <tag> origin/main` in this workflow deadlocks:
# it fires on the tag push, and docs/RELEASING.md pushes the tag BEFORE main, so
# that main never publishes a site announcing a release whose archives do not
# exist yet. The job would refuse, so no archives build, so there is nothing to
# verify, so main is never pushed. Nothing in that ring moves first and no timeout
# resolves it. Measured in v0.5.1: twenty minutes of polling, every run refused,
# and the release stopped with the tag public and nothing else done, finished by
# hand. tests/ci_workflow_test.go refuses that idiom by name.
#
# WHAT WOULD ACTUALLY RESTRAIN THIS, and it cannot be written here. The workflow
# GitHub runs for a tag is the one in the tagged tree, so any check in this file
# can be weakened in a copy of it by the same person who pushes the tag. Only a
# forge-side setting closes that — a tag ruleset on `refs/tags/v*` restricting
# who may create one, or a deployment environment with required reviewers on the
# job below. Neither is expressible in this file and neither is assertable by any
# test in this tree, so both are recorded here as absent rather than described as
# handled.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true

      # PINNED, AND PINNED TO THE VERSION THE SUITES ACTUALLY TEST. This said
      # `version: latest`, and that is the one-version-tests-another-version-ships
      # gap this repository refuses everywhere else, sitting on the publish path
      # itself. Two suites model this tool's behaviour against a NAMED version —
      # viewer-tests/site_toolchain_test.go dry-runs the release build and reads
      # the six archives out of it, and tests/release_notes_predict_test.go
      # reimplements its changelog rules, citing goreleaser/goreleaser/v2@v2.17.1's
      # own changelog.go by line — and the version those suites run under is the
      # one ci.yml installs. With `latest` here, every archive and changelog claim
      # those suites make was measured against one binary while every archive a
      # consumer downloads is produced by whichever binary GoReleaser had shipped
      # by tag day. Nothing goes red when the two diverge. The archives are simply
      # built by a tool nothing in this repository has ever run.
      #
      # THE SIBLING PIN is ci.yml's `DOSSIERX_GORELEASER_VERSION`, in that file's
      # top-level `env:` block, and there are deliberately exactly two spellings
      # of this version in the repository rather than one: a workflow cannot read
      # another workflow's `env:`, so the alternative to a second literal is an
      # expression resolved at run time, which no test can read before the job
      # starts. The two are held EQUAL by
      # TestTheReleaseWorkflowsGoReleaserPinAgreesWithTheOneCITests in
      # tests/ci_workflow_test.go, so moving one alone is a red run rather than a
      # silent drift — and moving both together is the whole of the recovery.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
