name: Deploy site

# Publishes the static pages under site/ to GitHub Pages using the modern
# artifact-based deployment (upload-pages-artifact + deploy-pages), not a
# gh-pages branch push.
#
# THERE IS NO BUILD STEP, AND ITS ABSENCE IS THE POINT. This workflow used to
# set up Node, run `npm ci` and `npm run build` on a Vite application, and
# upload site/dist. Every one of those steps was a way for the published page to
# differ from the page anybody checked: a VITE_* variable added here and not to
# the extraction that read the result, a Node the runner image moved underneath
# us, a bundle nobody had seen. site/ is now the artifact — what is uploaded is
# what is in the tree, byte for byte, so there is no version of this page that
# exists only on a runner.
#
# NOTE: the repository's Pages source must be set to "GitHub Actions"
# (Settings → Pages → Build and deployment → Source) for deploy-pages to
# publish. That is a one-time manual change a repo admin must make; this
# workflow cannot set it.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

# Allow the GITHUB_TOKEN to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
