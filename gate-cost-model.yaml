# gate-cost-model.yaml — what a gate run should cost, and the decisions behind
# that number.
#
# THIS FILE IS HAND-AUTHORED. It is configuration in the shape of surfaces.yaml,
# not a generated artifact in the shape of surface.json. Nothing regenerates it;
# a human edits it and the diff is the record.
#
# IT REFERENCES COUNTERS AND DOCUMENT BASES BY NAME ONLY. What a name MEANS —
# which unit a counter reports in, whether it reports on a run or on one agent,
# which bytes a basis resolves to and from what — lives in code, in
# gateLedgerCounters and gateLedgerBases in cmd/dossierx/gate_ledger_test.go.
# That split is deliberate and it is the point. A unit typed in this file and
# checked against a correspondence typed in this file is a circle, and one line
# inside that circle is enough to declare that the harness's per-subagent counter
# measures output tokens — which it does not, by a factor of 2.9. Changing what a
# name is held to mean is therefore a code change that arrives with its reason in
# the same diff, never a line of configuration.
#
# WHAT IS UNDECIDED IS SAID SO, and an undecided decision is not a gap. There is
# no default class, no default document basis and no default k. A surface whose
# class or whose basis is undecided cannot be quoted, and the refusal names the
# surface and says which of the two is missing. That is strictly better than the
# alternative, which in Go is not even an act: a map missing seven of thirteen
# keys returns the zero value without complaining, and a zero k funds nothing at
# all — a gate failing for a reason nobody can see.
#
# WHY NOTHING HERE CAN BE QUOTED YET, stated plainly rather than discovered:
# every class's seed is undecided, so no surface can be funded. See the classes
# below for the reason. This is the state decision C25 predicted — "a k a human
# edits" — with the edit not yet made.

schema: dossierx.gate-cost-model/1

# The reserve is headroom on top of the summed per-surface predictions, and the
# backstop factor is the multiple of the ceiling at which the harness's own
# emergency stop sits. Both are output-token quantities derived from a ceiling,
# and there is no ceiling until there is a seed.
reserve:
  undecided: true
  reason: >-
    A reserve is headroom on top of a ceiling, and no ceiling can be computed
    until a class seed exists. Choosing a number now would be choosing headroom
    over an unknown.

backstop_factor:
  undecided: true
  reason: >-
    The backstop is a multiple of the run ceiling. Same reason as the reserve:
    there is no ceiling yet to be a multiple of.

# ---------------------------------------------------------------------
# the classes
# ---------------------------------------------------------------------
#
# A class is a judgement about how much reading a surface's agent does per byte
# of its document. The names come from the release plan's three-way split; the
# exemplars it gives are in each class's derived_from-in-waiting below.
#
# EVERY SEED IS UNDECIDED, FOR ONE REASON, AND IT IS THE SAME REASON EACH TIME.
# The plan defines k as "total tokens an agent spends per token of document it
# reads — its own document, plus the shared surface.json and delta, plus
# reasoning and written findings", and its anatomy figure builds k~3 out of three
# roughly equal parts, two of which are input the agent READS. Decision C18 pins
# the enforceable unit as output tokens, because that is what budget.spent()
# returns and therefore the only thing a script can stop a run on. The two
# denominations are different quantities: phase 0 measured them 2.9x apart on
# this project — 1,417,000 reported against 489,218 output tokens.
#
# SUPPLYING OR CHANGING A SEED IS A CODE DIFF AND NOT ONLY AN EDIT HERE. The
# seed must also appear, at the same number and with the measurement behind it,
# in gateLedgerRatifiedSeeds in cmd/dossierx/gate_ledger_test.go; a seed stated
# in only one of the two places is refused, in either direction. The reason is
# the same one that keeps counters and bases in code, and it bites hardest
# exactly here: a `k:` move states what it replaced and is checked against it,
# but a SEED has nothing behind it to be checked against, so on a class that has
# recorded no move — which is every class below — rewriting this one line moves
# the number every ceiling is derived from and leaves no record that it moved.
# The whole of that record is the diff, and a diff a reviewer reads as
# configuration is a diff nobody reads as a decision.
#
# WHEN A SEED IS SUPPLIED AND K LATER MOVES, THE MOVE GOES IN A `k:` LIST UNDER
# THE CLASS — a LIST, oldest move first, never a single block that gets rewritten.
# Each entry carries the new value with both its units, the value it replaced,
# and the reason it moved; the value it replaced is checked against the move
# before it, or against the seed for the first one, and the last entry is the
# value in force. Editing a move in place instead of appending one is how the
# record of the previous move disappears in the same diff that claims to be a
# record. See testdata/gate-ledger/model-k-moved-twice.yaml for the shape.
#
# Two rules bind every move, including a human's. A move may raise k by at most
# 25% and lower it by at most 10% between two runs — unequal on purpose, because
# under-funding fails a gate while over-funding only wastes headroom nobody
# spends. Past either bound the move needs a `bound_override` saying why, and an
# override on a move that did not need one is refused so the escape hatch cannot
# become the default. A recorded run may then only say it was quoted at one of
# the values this list states, in the order it states them.
#
# So the plan's seeds of 3.5 / 2.5 / 2.0 cannot be transcribed here. A ceiling
# built from them would be roughly three times the real output demand, would
# never bind, and the gate would report a budget it is not being held to. What is
# needed is a seed in OUTPUT TOKENS PER BYTE of document. Writing the plan's
# denomination into this file is legal to attempt and is refused by name — see
# testdata/gate-ledger/model-k-in-the-plans-denomination.yaml, which is that
# attempt, kept as a fixture.

classes:
  - name: falsification-dense
    seed:
      undecided: true
      reason: >-
        The plan's exemplars for this class are skills and FORMAT, and its seed
        is 3.5 total tokens per document token. C18 requires output tokens per
        byte. No output-denominated seed has been supplied, so this class funds
        nothing.

  - name: read-once-counted
    seed:
      undecided: true
      reason: >-
        The plan's exemplars for this class are the site dump and README, and its
        seed is 2.5 total tokens per document token. C18 requires output tokens
        per byte. No output-denominated seed has been supplied, so this class
        funds nothing.

  - name: newest-entry-only
    seed:
      undecided: true
      reason: >-
        The plan's exemplars for this class are CHANGELOG and ROADMAP, and its
        seed is 2.0 total tokens per document token. C18 requires output tokens
        per byte. No output-denominated seed has been supplied, so this class
        funds nothing.

# ---------------------------------------------------------------------
# the surfaces
# ---------------------------------------------------------------------
#
# One entry per surface surfaces.yaml declares — checked, not assumed. A surface
# appearing in the manifest with no entry here stops the gate, and so does an
# entry here for a surface the manifest does not declare.
#
# THE CLASSES THAT ARE DECIDED ARE THE SIX THE PLAN NAMES BY EXEMPLAR. The other
# seven are undecided rather than defaulted, because assigning a class is a
# judgement about how much of a document is in scope for falsification and
# inventing one here would bury a design choice inside a configuration file.
#
# THE BASES THAT ARE DECIDED ARE THE TWELVE WHERE surfaces.yaml'S OWN DESCRIPTION
# AND ITS PATHS AGREE. One does not agree, and it is undecided:
#
# SITE USED TO BE THE SECOND, AND IS NOW DECIDED. surfaces.yaml said "the surface
# is the RENDERED DOM of a real build (plus its head metadata), not the component
# source" while its paths claimed site/ — 375,332 bytes of TSX and TS. The
# rendered text was gate/site-text.json, an ephemeral artifact that did not exist
# on disk, so the right basis was not extractable from the tree at all. That gap
# closed by removal rather than by measurement: site/ is now two static HTML
# pages and a stylesheet with no build step, the surface IS those tracked files,
# and the description and the paths describe the same bytes. Its basis is
# manifest.tracked_files like every other agreeing surface.
#
#   binary-and-viewer  surfaces.yaml says the surface is "cobra Short and Long
#                      text and flag usage ... the error messages and hints, and
#                      the viewer templates" while its paths claim cmd/dossierx/
#                      and internal/ entire — 1,949,261 bytes of Go and
#                      TypeScript source. surface.json's commands array carries
#                      only {path, short, flags}, so the prose document cannot be
#                      reconstructed from the committed inventory either.
#
# That one is why a basis has no default — and the gap it names shrank sharply
# when the site's did. The plan's own budget basis is roughly 560 KB across all
# thirteen surfaces; the tracked files those thirteen own came to about 2.65 MB,
# of which site/ was 375 KB and binary-and-viewer is 1.95 MB. Funding an
# unextractable surface from tracked files would leave every other rule green and
# the ceiling an order of magnitude too large, with nothing able to notice.
#
# NOTE THAT binary-and-viewer'S CLASS AND ITS BASIS ARE BOTH UNDECIDED, AND THAT
# IS NOT AN ACCIDENT. Deciding its class alone would arm the wrong-bytes failure:
# until it has a class, the undecided-class refusal is the only thing standing
# between the largest document in the repository and a quote computed over the
# wrong bytes. The two questions are answered together or not at all.

surfaces:
  - name: readme
    class: read-once-counted
    document_basis: manifest.tracked_files

  - name: changelog
    class: newest-entry-only
    document_basis: manifest.tracked_files

  - name: claim-format-spec
    class: falsification-dense
    document_basis: manifest.tracked_files

  - name: roadmap
    class: newest-entry-only
    document_basis: manifest.tracked_files

  - name: contributing
    class: undecided
    document_basis: manifest.tracked_files

  - name: release-procedure
    class: undecided
    document_basis: manifest.tracked_files

  - name: agent-skills
    class: falsification-dense
    document_basis: manifest.tracked_files

  - name: exported-skills
    class: undecided
    document_basis: manifest.tracked_files

  # DECIDED, and it was undecided for a real reason that no longer holds — see
  # the note above the classes block.
  - name: site
    class: read-once-counted
    document_basis: manifest.tracked_files

  - name: ci-merge-gate-template
    class: undecided
    document_basis: manifest.tracked_files

  - name: install-scripts
    class: undecided
    document_basis: manifest.tracked_files

  - name: release-notes
    class: undecided
    document_basis: manifest.tracked_files

  - name: binary-and-viewer
    class: undecided
    document_basis: undecided
